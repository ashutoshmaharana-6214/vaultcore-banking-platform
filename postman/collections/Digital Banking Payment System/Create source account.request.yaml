$kind: http-request
url: "{{baseUrl}}/api/accounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"accountNumber":"{{sourceAccount}}","holderName":"Ashutosh","openingBalance":5000.00}'
scripts:
  - type: afterResponse
    code: pm.test('Account created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
