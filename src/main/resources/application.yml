spring:
  application:
    name: vaultcore-banking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Local development only. Use migrations + validate before public staging.
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names: account-balance
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
vaultcore:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:vaultcore-local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
